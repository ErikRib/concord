[package]
name = "concord"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
sha2 = "0.10"
# SQLite embutido no executável (compilado junto, sem instalação separada).
rusqlite = { version = "0.32", features = ["bundled", "uuid"] }

[profile.release]
lto = "thin"
